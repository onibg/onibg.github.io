name: 測試 Actions 4的倍數整點觸發
on:
#workflow_dispatch: #手動觸發
 schedule:
  - cron: '0 0,4,8,12,16,20 * * *' #分鐘=0;小時=0,4,8,12,16,20;每天 每月 每星期 (UTC時間)
jobs:
 test:
  runs-on: ubuntu-latest
  steps:
   - name: 持續執行
     run: |
      node<<'EOF'
      const start=Date.now();
      console.log('開始:',new Date(start).toISOString())
      setInterval(()=>{
       const elapsed=Date.now()-start
       const seconds=Math.floor(elapsed/1000)
       const h=Math.floor(seconds/3600)
       const m=Math.floor((seconds%3600)/60)
       const s=seconds%60
       console.log('已執行:',h+' 小時',m+' 分',s+' 秒')
      },60000)
      EOF